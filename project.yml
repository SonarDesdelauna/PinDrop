name: PinDrop

options:
  bundleIdPrefix: com.pindrop
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  PinDrop:
    type: application
    platform: iOS
    sources:
      - path: PinDrop
        excludes:
          - Info.plist
          - PinDrop.entitlements
          - Resources
      - path: PinDrop/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pindrop.app
        PRODUCT_NAME: PinDrop
        INFOPLIST_FILE: PinDrop/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PinDrop/PinDrop.entitlements
    entitlements:
      path: PinDrop/PinDrop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pindrop.app
    dependencies:
      - package: Supabase
        product: Supabase
      - target: PinDropWidget
        embed: true
        codeSign: true

  PinDropWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PinDropWidget
        excludes:
          - Info.plist
          - PinDropWidget.entitlements
      # Shared String Catalog: the widget is localized with the very same keys as the app.
      - path: PinDrop/Resources/Localizable.xcstrings
        buildPhase: resources
      # Shared source files compiled into both targets.
      - path: PinDrop/Core/DesignSystem/Theme.swift
      - path: PinDrop/Core/Utilities/LocaleFormatter.swift
      - path: PinDrop/Core/Services/WidgetSyncService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pindrop.app.widget
        PRODUCT_NAME: PinDropWidget
        INFOPLIST_FILE: PinDropWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PinDropWidget/PinDropWidget.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: PinDropWidget/PinDropWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pindrop.app
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  PinDrop:
    build:
      targets:
        PinDrop: all
        PinDropWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
